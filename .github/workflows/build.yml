name: Build SoulTrack Mobile

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@^8.4.0 @capacitor/cli@^8.4.0
          npm install @capacitor/android@^8.4.0
          npm install @capacitor/push-notifications@8
          npm install @capacitor/splash-screen@8
          npm install @capacitor/filesystem@8
          npm install @capacitor/share@8
          npm install @capawesome/capacitor-android-edge-to-edge-support@8

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ─── AJOUT : on force un dossier android/ propre ───────────────────
      # Si android/ est resté versionné (ou traîne d'un run précédent en
      # cache), "cap add android" peut ne pas régénérer certains fichiers
      # et laisser une config obsolète. On repart toujours de zéro.
      # ─────────────────────────────────────────────────────────────────
      - name: Clean stale platform folder
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      # ─── ÉTAPE SUPPRIMÉE : "Add App Links intent-filter" ───────────────
      # Cette étape ajoutait un <intent-filter android:autoVerify="true">
      # qui faisait qu'Android ouvrait automatiquement l'app à chaque clic
      # sur un lien https://www.soultrack.org/... (dans Gmail, SMS, Chrome,
      # etc.), même app fermée. On la retire pour que le web reste TOUJOURS
      # web, même avec l'app installée. L'app garde son propre accès direct
      # (icône sur l'écran d'accueil) qui charge server.url en interne, donc
      # ce n'est pas affecté par ce retrait.
      # ─────────────────────────────────────────────────────────────────

      - name: Generate app icons & splash
        run: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android

      - name: Set launch URL
        run: |
          sed -i 's|launchUrl = null|launchUrl = "https://www.soultrack.org/login"|g' android/app/src/main/java/org/soultrack/app/MainActivity.java 2>/dev/null || true

      - name: Inject google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Create assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor
        run: npx cap sync android

      # ─── AJOUT : vérification de la couleur de la navbar ───────────────
      # Confirme que le plugin EdgeToEdge a bien injecté #3E7DCF dans les
      # fichiers de thème natifs après le sync. Si la couleur n'apparaît
      # pas ici, le problème vient de la config/installation du plugin
      # et pas du rendu à l'exécution.
      # ─────────────────────────────────────────────────────────────────
      - name: Debug theme colors
        run: |
          echo "=== Version du plugin EdgeToEdge installée ==="
          npm ls @capawesome/capacitor-android-edge-to-edge-support
          echo "=== capacitor.config.json embarqué (lu au runtime par le plugin) ==="
          cat android/app/src/main/assets/capacitor.config.json || echo "capacitor.config.json introuvable dans assets/"
          echo "=== Recherche de la couleur dans tout android/ (sanity check) ==="
          grep -r "3E7DCF" android/ || echo "Couleur #3E7DCF introuvable nulle part dans android/"

      - name: Fix Android navigation bar
        run: |
          # Upgrade targetSdk à 36 requis par Google Play depuis août 2026
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 36/' android/variables.gradle
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/' android/variables.gradle

          # Sur Capacitor 8.4.0+, @capawesome/capacitor-android-edge-to-edge-support
          # (v8) + le plugin natif SystemBars gèrent correctement l'edge-to-edge,
          # les insets ET les couleurs indépendantes des deux barres — configuré
          # entièrement via capacitor.config.js (plugins.SystemBars + plugins.EdgeToEdge).
          # AVANT 8.4.0, "SystemBars.insetsHandling: disable" était ignoré côté
          # natif : le SystemBars core continuait de gérer la barre en edge-to-edge
          # natif transparent, ce qui écrasait la couleur posée par le plugin
          # capawesome (d'où une barre noire par défaut au lieu de #3E7DCF).
          # Rien à modifier ici côté styles.xml/MainActivity.java.

          echo "=== Versions Capacitor installées ==="
          npx cap --version
          echo "=== variables.gradle ==="
          cat android/variables.gradle

      - name: Set version code
        run: |
          # On combine run_number et run_attempt : run_attempt s'incrémente
          # à chaque "Re-run" d'un même workflow, alors que run_number reste
          # identique. Sans ça, relancer un ancien run régénère exactement
          # le même versionCode déjà uploadé sur Play Console → rejet.
          VERSION_CODE=$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))
          echo "Version code utilisé : $VERSION_CODE"
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.$VERSION_CODE\"/" android/app/build.gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode Keystore
        run: |
          echo '${{ secrets.KEYSTORE_BASE64 }}' | base64 -d > $GITHUB_WORKSPACE/soultrack.keystore

      - name: Build APK Release
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/soultrack.keystore \
            -Pandroid.injected.signing.store.password=soultrack123 \
            -Pandroid.injected.signing.store.key.alias=soultrack \
            -Pandroid.injected.signing.key.alias=soultrack \
            -Pandroid.injected.signing.key.password=soultrack123

      - name: Build AAB Release
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/soultrack.keystore \
            -Pandroid.injected.signing.store.password=soultrack123 \
            -Pandroid.injected.signing.store.key.alias=soultrack \
            -Pandroid.injected.signing.key.alias=soultrack \
            -Pandroid.injected.signing.key.password=soultrack123

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: soultrack-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB Release
        uses: actions/upload-artifact@v4
        with:
          name: soultrack-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@^8.4.0 @capacitor/cli@^8.4.0
          npm install @capacitor/ios@^8.4.0
          npm install @capacitor/push-notifications@8
          npm install @capacitor/filesystem@8
          npm install @capacitor/share@8

      # ─── AJOUT : on force un dossier ios/ propre ───────────────────────
      # Même logique que pour Android : évite qu'un dossier ios/ obsolète
      # (versionné par erreur, ou resté d'un run précédent) fasse croire
      # à "cap add ios" que la plateforme existe déjà, auquel cas il ne
      # régénère pas le Podfile et les étapes suivantes échouent avec
      # "No such file or directory".
      # ─────────────────────────────────────────────────────────────────
      - name: Clean stale platform folder
        run: rm -rf ios

      # ─── IMPORTANT : depuis Capacitor 8, iOS utilise Swift Package Manager
      # (SPM) par défaut, plus CocoaPods. "cap add ios" sans option génère
      # ios/App/CapApp-SPM/Package.swift au lieu d'un Podfile, ce qui casse
      # tout le reste du job (pod install, .xcworkspace, edits du Podfile).
      # On force explicitement CocoaPods pour rester compatible avec le
      # reste du pipeline.
      # ─────────────────────────────────────────────────────────────────
      - name: Add iOS platform
        run: |
          npx cap add ios --packagemanager cocoapods
          echo "=== Contenu généré dans ios/ ==="
          find ios -maxdepth 3
          test -f ios/App/Podfile || (echo "❌ Podfile manquant après cap add ios" && exit 1)

      - name: Inject GoogleService-Info.plist
        run: echo '${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}' > ios/App/App/GoogleService-Info.plist

      - name: Set iOS deployment target
        run: |
          PODFILE="ios/App/Podfile"
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '16.0'/" "$PODFILE"
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 16.0/g' "$PBXPROJ"

          python3 - << 'PY'
          path = "ios/App/Podfile"
          with open(path) as f:
              content = f.read()

          addition = (
              "\n  installer.pods_project.targets.each do |target|\n"
              "    target.build_configurations.each do |config|\n"
              "      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'\n"
              "    end\n"
              "  end\n"
          )
          content = content.replace(
              "assertDeploymentTarget(installer)",
              "assertDeploymentTarget(installer)" + addition,
          )

          with open(path, "w") as f:
              f.write(content)
          PY

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: soultrack-ios
          path: ios/App/build
