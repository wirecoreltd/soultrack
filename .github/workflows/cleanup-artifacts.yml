name: Cleanup Artifacts
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check remaining artifact size
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          gh api repos/$REPO/actions/artifacts --paginate --jq '.artifacts[].size_in_bytes' | \
            awk '{sum+=$1} END {print sum/1024/1024 " MB"}'

      - name: Delete all artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          gh api repos/$REPO/actions/artifacts --paginate | \
            jq -r '.artifacts[].id' | \
            while read id; do
              echo "Suppression artifact $id"
              gh api repos/$REPO/actions/artifacts/$id -X DELETE || echo "Échec pour $id, on continue"
              sleep 0.3
            done
