name: Build SoulTrack Mobile

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7
          npm install @capacitor/android@7
          npm install @capacitor/push-notifications@7
          npm install @capacitor/splash-screen@7
          npm install @capgo/capacitor-navigation-bar@7

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Add Android platform
        run: npx cap add android

      # ─── ÉTAPE SUPPRIMÉE : "Add App Links intent-filter" ───────────────
      # Cette étape ajoutait un <intent-filter android:autoVerify="true">
      # qui faisait qu'Android ouvrait automatiquement l'app à chaque clic
      # sur un lien https://www.soultrack.org/... (dans Gmail, SMS, Chrome,
      # etc.), même app fermée. On la retire pour que le web reste TOUJOURS
      # web, même avec l'app installée. L'app garde son propre accès direct
      # (icône sur l'écran d'accueil) qui charge server.url en interne, donc
      # ce n'est pas affecté par ce retrait.
      # ─────────────────────────────────────────────────────────────────

      - name: Generate app icons & splash
        run: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android

      - name: Set launch URL
        run: |
          sed -i 's|launchUrl = null|launchUrl = "https://www.soultrack.org/login"|g' android/app/src/main/java/org/soultrack/app/MainActivity.java 2>/dev/null || true

      - name: Force dark nav bar icons (WindowInsetsController)
        run: |
          # L'attribut de thème android:windowLightNavigationBar n'est pas
          # honoré par certains fabricants Android (Samsung, Xiaomi, etc.).
          # On force donc l'apparence des icônes directement en code natif
          # via l'API officielle WindowInsetsControllerCompat, qui fonctionne
          # de façon fiable indépendamment du thème et du fabricant.
          MAIN_ACTIVITY="android/app/src/main/java/org/soultrack/app/MainActivity.java"

          if [ -f "$MAIN_ACTIVITY" ]; then
            # Ajoute l'import nécessaire
            sed -i '/import com.getcapacitor.BridgeActivity;/a import androidx.core.view.WindowInsetsControllerCompat;' "$MAIN_ACTIVITY"

            # Force les icônes système (nav bar + status bar) en foncé,
            # juste après l'initialisation de l'activité.
            sed -i '/super.onCreate(savedInstanceState);/a \
              WindowInsetsControllerCompat windowInsetsController =\
                  new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());\
              windowInsetsController.setAppearanceLightNavigationBars(true);\
              windowInsetsController.setAppearanceLightStatusBars(true);' "$MAIN_ACTIVITY"

            echo "=== MainActivity.java ==="
            cat "$MAIN_ACTIVITY"
          else
            echo "MainActivity.java introuvable à $MAIN_ACTIVITY — vérifiez le nom de package."
          fi

      - name: Inject google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Create assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix Android navigation bar
        run: |
          # Upgrade targetSdk à 36 requis par Google Play depuis août 2026
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 36/' android/variables.gradle
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/' android/variables.gradle

          # Fix edge-to-edge Android 16 — injecter le bon thème
          STYLES_FILE="android/app/src/main/res/values/styles.xml"
          sed -i 's|</style>|    <item name="android:navigationBarColor">#333699</item>\n    <item name="android:statusBarColor">#333699</item>\n    <item name="android:windowLightNavigationBar">false</item>\n    <item name="android:windowLightStatusBar">false</item>\n</style>|' "$STYLES_FILE"

          # Fix edge-to-edge via MainActivity
          MAIN="android/app/src/main/java/org/soultrack/app/MainActivity.java"
          cat > "$MAIN" << 'JAVAEOF'
          package org.soultrack.app;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window window = getWindow();
                  WindowCompat.setDecorFitsSystemWindows(window, true);
                  window.setNavigationBarColor(Color.parseColor("#333699"));
                  window.setStatusBarColor(Color.parseColor("#333699"));
                  WindowInsetsControllerCompat controller =
                      new WindowInsetsControllerCompat(window, window.getDecorView());
                  controller.setAppearanceLightNavigationBars(false);
                  controller.setAppearanceLightStatusBars(false);
              }
          }
          JAVAEOF

          echo "=== variables.gradle ==="
          cat android/variables.gradle
          echo "=== styles.xml ==="
          cat "$STYLES_FILE"
          echo "=== MainActivity.java ==="
          cat "$MAIN"

      - name: Set version code
        run: |
          # On combine run_number et run_attempt : run_attempt s'incrémente
          # à chaque "Re-run" d'un même workflow, alors que run_number reste
          # identique. Sans ça, relancer un ancien run régénère exactement
          # le même versionCode déjà uploadé sur Play Console → rejet.
          VERSION_CODE=$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))
          echo "Version code utilisé : $VERSION_CODE"
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.$VERSION_CODE\"/" android/app/build.gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode Keystore
        run: |
          echo '${{ secrets.KEYSTORE_BASE64 }}' | base64 -d > $GITHUB_WORKSPACE/soultrack.keystore

      - name: Build APK Release
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/soultrack.keystore \
            -Pandroid.injected.signing.store.password=soultrack123 \
            -Pandroid.injected.signing.store.key.alias=soultrack \
            -Pandroid.injected.signing.key.alias=soultrack \
            -Pandroid.injected.signing.key.password=soultrack123

      - name: Build AAB Release
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/soultrack.keystore \
            -Pandroid.injected.signing.store.password=soultrack123 \
            -Pandroid.injected.signing.store.key.alias=soultrack \
            -Pandroid.injected.signing.key.alias=soultrack \
            -Pandroid.injected.signing.key.password=soultrack123

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: soultrack-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB Release
        uses: actions/upload-artifact@v4
        with:
          name: soultrack-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7
          npm install @capacitor/ios@7
          npm install @capacitor/push-notifications@7

      - name: Add iOS platform
        run: npx cap add ios

      - name: Inject GoogleService-Info.plist
        run: echo '${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}' > ios/App/App/GoogleService-Info.plist

      - name: Set iOS deployment target
        run: |
          PODFILE="ios/App/Podfile"
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' 's/assertDeploymentTarget(installer)//' "$PODFILE"
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '16.0'/" "$PODFILE"
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 16.0/g' "$PBXPROJ"

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: soultrack-ios
          path: ios/App/build
